[project]
name = "resilionet"
version = "0.1.0"
description = "Rural EMS and grid-fragility sentinel for Bastrop County"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["resilionet-api", "resilionet-agents", "resilionet-mcp"]

[tool.uv]
package = false

[tool.uv.sources]
resilionet-api = { workspace = true }
resilionet-agents = { workspace = true }
resilionet-mcp = { workspace = true }

[tool.uv.workspace]
members = ["packages/agents", "packages/api", "packages/mcp_tools"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
