[project]
name = "resilionet-api"
version = "0.1.0"
description = "FastAPI ingestion for resilience plans"
requires-python = ">=3.11"
dependencies = [
    "resilionet-agents",
    "resilionet-mcp",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2",
]

[tool.uv.sources]
resilionet-agents = { workspace = true }
resilionet-mcp = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
